name: media

# Records the demo walkthrough video and screenshots, and saves them to the "media" branch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/media/**', '.github/workflows/media.yml']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install app
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm install --no-audit --no-fund
          npm run build
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force

      - name: Start app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up >/dev/null && break; sleep 1; done

      - name: Record
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node .github/media/record.mjs

      - name: Save to media branch
        run: |
          mv media-out/raw/*.webm media-out/walkthrough.webm
          rm -rf media-out/raw
          cd media-out
          git init -q -b media
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Demo media from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" media

      - name: Report problems
        if: failure()
        run: |
          msg=$(tail -40 serve.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=serve.log::$msg"
